interface:
  display_name: "博士导师深度检索"
  short_description: "筛选肿瘤导师并逐篇审计实验、生信、组学及临床转化模式"
  default_prompt: "使用 $phd-supervisor-research 检索指定地区与高校的成人实体瘤博士导师，默认按肺癌/胸部肿瘤范围；仅当用户明确选择或当前申请人材料支持时，才扩展至肿瘤免疫、转化基因学、多组学及癌症分子生物学。逐人核查当前任职、肿瘤主线、联系方式、博士路径与申请材料，并对近期候选人主导原创论文分别编码基础实验、应用生信、组学、理论方法、纯临床及临床转化深度，结构化核实通讯/共同通讯与senior作者身份，五年不足五篇时核验八年扩展检索，区分机器暂定、逐篇摘要深读与全文设计核查，真实记录审阅主体；排除以儿童肿瘤或血液肿瘤为主要方向者，以及核医学、影像组学/核心肿瘤影像和仅在工程、计算机或独立AI/数学/数据单位任职者，只交付可追溯事实。"

policy:
  allow_implicit_invocation: true
